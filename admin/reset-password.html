<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset Password — Val & Dan Kids Boutique</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  body.vd-login { background: var(--pink-lt); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .vd-login-card { background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lux); padding:40px 36px; width:100%; max-width:400px; }
  .vd-login-logo { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; }
  .vd-login-logo img { width:64px; height:64px; border-radius:50%; object-fit:cover; box-shadow:var(--shadow-sm); }
  .vd-login-logo h1 { font-family:"Fraunces", serif; font-weight:500; font-size:19px; color:var(--ink); text-align:center; }
  .vd-login-error, .vd-login-success { display:none; border-radius:var(--radius-sm); padding:11px 14px; font-size:13px; font-weight:600; margin-bottom:16px; }
  .vd-login-error.show, .vd-login-success.show { display:block; }
  .vd-login-error { background:#FDECEC; color:#B23B3B; border:1px solid #F5C7C7; }
  .vd-login-success { background:#EAF3E3; color:#4B7A38; border:1px solid #CFE6BE; }
</style>
</head>
<body class="vd-login">
<div class="vd-login-card">
  <div class="vd-login-logo">
    <img src="../logo.jpg" alt="Val & Dan Kids Boutique" />
    <h1>Set a New Password</h1>
  </div>
  <div id="vd-error" class="vd-login-error"></div>
  <div id="vd-success" class="vd-login-success"></div>
  <form id="vd-reset-form">
    <div class="vd-field">
      <label for="vd-pw1">New password</label>
      <input type="password" id="vd-pw1" minlength="8" required />
    </div>
    <div class="vd-field">
      <label for="vd-pw2">Confirm new password</label>
      <input type="password" id="vd-pw2" minlength="8" required />
    </div>
    <button type="submit" class="btn btn-primary btn-full" id="vd-reset-btn">Update Password</button>
  </form>
  <a href="login.html" class="vd-back-link" style="display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--ink-2);">← Back to sign in</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  vdRequireSupabase();
  const errBox = document.getElementById('vd-error');
  const okBox = document.getElementById('vd-success');

  document.getElementById('vd-reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!window.sb) return;
    const pw1 = document.getElementById('vd-pw1').value;
    const pw2 = document.getElementById('vd-pw2').value;
    errBox.classList.remove('show'); okBox.classList.remove('show');

    if (pw1.length < 8) { errBox.textContent = 'Password must be at least 8 characters.'; errBox.classList.add('show'); return; }
    if (pw1 !== pw2) { errBox.textContent = 'Passwords do not match.'; errBox.classList.add('show'); return; }

    const btn = document.getElementById('vd-reset-btn');
    btn.disabled = true; btn.textContent = 'Updating…';

    const { error } = await window.sb.auth.updateUser({ password: pw1 });
    btn.disabled = false; btn.textContent = 'Update Password';

    if (error) {
      errBox.textContent = 'This reset link is invalid or has expired. Request a new one from the login page.';
      errBox.classList.add('show');
    } else {
      okBox.textContent = 'Password updated! Redirecting you to sign in…';
      okBox.classList.add('show');
      setTimeout(() => { location.href = 'login.html'; }, 1800);
    }
  });
</script>
<script src="../translate-widget.js"></script>
</body>
</html>
